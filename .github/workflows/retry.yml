name: Reintentar crear instancia ARM (A1.Flex)

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch: {}

concurrency:
  group: oci-launch
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  intentar-crear:
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    env:
      OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
    steps:
      - name: Instalar OCI CLI
        run: pip install oci-cli

      - name: Configurar credenciales de OCI
        run: |
          mkdir -p ~/.oci
          printf '%s' "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          cat > ~/.oci/config << EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/key.pem
          EOF
          chmod 600 ~/.oci/config

      - name: Revisar si ya existe una instancia
        id: check
        run: |
          COUNT=$(oci compute instance list \
            --compartment-id "${{ secrets.OCI_COMPARTMENT_OCID }}" \
            --all \
            --query "length(data[?shape=='VM.Standard.A1.Flex' && \"lifecycle-state\"!='TERMINATED' && \"lifecycle-state\"!='TERMINATING'])" \
            --raw-output)
          COUNT=$(echo "$COUNT" | tr -d '[:space:]')
          if [ -z "$COUNT" ] || [ "$COUNT" = "null" ]; then COUNT=0; fi
          echo "Instancias A1.Flex activas: $COUNT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Guardar la clave pública SSH en un archivo
        if: steps.check.outputs.count == '0'
        run: printf '%s' "${{ secrets.SSH_PUBLIC_KEY }}" > /tmp/id_rsa.pub

      - name: Reintentar lanzar la instancia (bucle de ~50 min)
        id: loop
        if: steps.check.outputs.count == '0'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set +e
          notificar() {
            if [ -n "$NTFY_TOPIC" ]; then
              curl -s -d "$1" "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
            else
              echo "AVISO: el secret NTFY_TOPIC esta vacio, no se puede notificar."
            fi
          }

          FIN=$((SECONDS + 3000))
          INTENTO=0
          while [ $SECONDS -lt $FIN ]; do
            INTENTO=$((INTENTO + 1))
            RESULT=$(oci compute instance launch \
              --compartment-id "${{ secrets.OCI_COMPARTMENT_OCID }}" \
              --availability-domain "${{ secrets.OCI_AD }}" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config "{\"ocpus\": ${{ secrets.OCI_OCPUS }}, \"memoryInGBs\": ${{ secrets.OCI_MEMORY_GB }}}" \
              --subnet-id "${{ secrets.OCI_SUBNET_OCID }}" \
              --image-id "${{ secrets.OCI_IMAGE_OCID }}" \
              --assign-public-ip true \
              --ssh-authorized-keys-file /tmp/id_rsa.pub \
              --display-name "mi-instancia-arm" \
              --no-retry 2>&1)

            if echo "$RESULT" | grep -qi '"lifecycle-state": "PROVISIONING"\|"lifecycle-state": "RUNNING"'; then
              echo "EXITO en el intento $INTENTO. Instancia creada."
              notificar "Tu instancia ARM en Oracle Cloud fue creada. Entra a la consola a verla."
              exit 0
            elif echo "$RESULT" | grep -qi "out of host capacity\|OutOfCapacity\|out of capacity"; then
              echo "Intento $INTENTO: sin capacidad todavia."
            elif echo "$RESULT" | grep -qi "TooManyRequests\|Too many requests"; then
              echo "Intento $INTENTO: Oracle limito las peticiones (429). Espero 3 minutos."
              sleep 120
            else
              echo "$RESULT"
              echo "Error distinto a falta de capacidad. Se detiene."
              notificar "El script de Oracle fallo con un error distinto a 'sin capacidad'. Revisa GitHub Actions."
              exit 1
            fi
            sleep 60
          done
          echo "Fin del ciclo de ~50 min sin conseguir instancia."
          echo "reintentar=true" >> "$GITHUB_OUTPUT"

      - name: Relanzar el workflow
        if: steps.loop.outputs.reintentar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run retry.yml --ref main
